<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>physicsim</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body data-mode="edit">
  <div id="app">
    <header id="toolbar">
      <div class="brand">physicsim</div>

      <div class="group only-edit">
        <select id="scene-select" title="Scene"></select>
        <button id="btn-new" title="New scene">New</button>
        <button id="btn-save" title="Save scene">Save</button>
      </div>

      <div class="group only-edit">
        <button id="btn-box" title="Add box">Box</button>
        <button id="btn-sphere" title="Add sphere">Sphere</button>
        <button id="btn-cylinder" title="Add cylinder">Cylinder</button>
        <button id="btn-lekiwi" title="Insert LeKiwi robot">LeKiwi</button>
      </div>

      <div class="group only-edit">
        <select id="joint-type" title="Joint type">
          <option value="revolute">Revolute</option>
          <option value="prismatic">Prismatic</option>
          <option value="fixed">Fixed</option>
        </select>
        <button id="btn-joint" title="Create joint between two selected bodies (shift-click)">Joint</button>
      </div>

      <div class="group only-edit">
        <button id="btn-duplicate" title="Duplicate (Ctrl+D)">Duplicate</button>
        <button id="btn-delete" title="Delete (Del)">Delete</button>
      </div>

      <div class="group only-edit">
        <div class="seg">
          <button id="btn-translate" class="on" title="Translate (T)">Move</button>
          <button id="btn-rotate" title="Rotate (R)">Rotate</button>
        </div>
        <button id="btn-snap" title="Snap 0.01 m / 15°">Snap</button>
      </div>

      <div class="group only-simulate">
        <button id="btn-play" class="primary">▶ Play</button>
        <button id="btn-pause">Pause</button>
        <button id="btn-step">Step</button>
        <button id="btn-stop">■ Stop</button>
      </div>

      <div class="group only-playback">
        <select id="rec-select" title="Recording"></select>
        <button id="pb-play" class="primary">▶ Play</button>
        <select id="pb-speed" title="Playback speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </div>

      <div class="spacer"></div>

      <div class="seg modes">
        <button data-mode="edit" class="on">Edit</button>
        <button data-mode="simulate">Simulate</button>
        <button data-mode="playback">Playback</button>
      </div>
    </header>

    <aside id="outliner">
      <div class="panel-title">Scene tree</div>
      <div id="outliner-tree"></div>
    </aside>

    <main id="viewport">
      <div id="viewtools">
        <button data-view="top">Top</button>
        <button data-view="front">Front</button>
        <button data-view="right">Right</button>
        <button data-view="iso">Iso</button>
        <span class="sep"></span>
        <button id="btn-ortho" title="Toggle perspective / orthographic">Persp</button>
        <button id="btn-fit" title="Frame selection (F)">Fit</button>
      </div>
      <div id="feeds" class="only-simulate"></div>
      <div id="timeline" class="only-playback">
        <input type="range" id="pb-slider" min="0" max="0" value="0" step="1">
        <span id="pb-time">0.000 s</span>
      </div>
    </main>

    <aside id="right">
      <div id="simpanel" class="only-simulate">
        <div class="panel-title">Simulation</div>
        <div class="section">
          <div class="row"><label>State</label><span id="sim-state" class="readout">stopped</span></div>
          <div class="row"><label>Time</label><span id="sim-time" class="readout">0.000 s</span></div>
        </div>
        <div id="robot-section" class="section">
          <div class="section-title">LeKiwi</div>
          <div class="row" id="score-row" style="display: none"><label>Score</label><span id="score" class="readout"></span></div>
          <div class="row">
            <label>Autopilot</label>
            <select id="autopilot">
              <option value="off">off</option>
              <option value="expert">expert</option>
              <option value="policy">policy</option>
              <option value="expert_both">expert (both robots)</option>
              <option value="policy_both">policy (both robots)</option>
            </select>
          </div>
          <div class="keys">
            <span><kbd>W</kbd><kbd>S</kbd> drive</span>
            <span><kbd>A</kbd><kbd>D</kbd> strafe</span>
            <span><kbd>Q</kbd><kbd>E</kbd> turn</span>
            <span><kbd>Y</kbd><kbd>U</kbd> pan</span>
            <span><kbd>H</kbd><kbd>J</kbd> shoulder</span>
            <span><kbd>N</kbd><kbd>M</kbd> elbow</span>
            <span><kbd>I</kbd><kbd>O</kbd> wrist</span>
            <span><kbd>K</kbd><kbd>L</kbd> roll</span>
            <span><kbd>Space</kbd> gripper <b id="gripper-state"></b></span>
          </div>
        </div>
        <div class="section">
          <div class="section-title">Joints</div>
          <div id="joint-readout"></div>
        </div>
      </div>
      <div id="inspector"></div>
    </aside>

    <footer id="statusbar">
      <span id="status-mode"></span>
      <span id="status-sel"></span>
      <span class="spacer"></span>
      <span id="status-hint">LMB orbit · ctrl+LMB / RMB pan · wheel zoom · F frame · shift-click multi-select</span>
      <span id="status-time"></span>
      <span id="status-backend">backend: …</span>
    </footer>
  </div>
  <div id="toasts"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
